<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><title>Cero Falla | Revisión General y Mantenimiento</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand"><b>CERO <span>FALLA</span></b><small>ESPECIALISTA AUTOMOTRIZ</small></div><h1>REVISIÓN GENERAL Y MANTENIMIENTO</h1></header><main><section class="panel"><div class="toolbar"><button id="newBtn" class="secondary">Nueva revisión</button><button id="historyBtn" class="secondary">Historial</button><button id="saveBtn">Guardar</button><button id="pdfBtn">Generar / imprimir PDF</button></div><div id="history" class="history hidden"></div><h2>Datos del vehículo</h2><div class="grid"><label>Cliente<input data-meta="cliente"></label><label>Fecha<input type="date" data-meta="fecha"></label><label>Marca<input data-meta="marca"></label><label>Modelo<input data-meta="modelo"></label><label>VIN / Chasis<input data-meta="vin"></label><label>N° Motor<input data-meta="motor"></label><label>Patente<input data-meta="patente"></label><label>Kilometraje<input inputmode="numeric" data-meta="km"></label></div></section><div class="summary panel"><b>Resumen:</b><span class="ok">OK <strong id="okCount">0</strong></span><span class="warn">Atención <strong id="warnCount">0</strong></span><span class="bad">Intervención <strong id="badCount">0</strong></span></div><div id="form"></div><section class="panel"><h2>CONCLUSIÓN FINAL</h2><textarea id="conclusion" rows="7" placeholder="Resumen general, reparaciones recomendadas, prioridades y próxima mantención..."></textarea></section><footer>Cero Falla Automotriz SpA · +56 9 6915 2515 · cerofalla.automotriz@gmail.com<br><b>Tú no tienes que venir, yo voy.</b></footer></main><script src="app.js"></script></body></html>
